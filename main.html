<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case-Insensitive Substring Index</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Substring Index (Case-Insensitive)</h2>

    <label for="strInput">Main String (str):</label>
    <input type="text" id="strInput" placeholder="e.g. Hello World" value="Hello World">

    <label for="subStrInput">Substring to Find (subStr):</label>
    <input type="text" id="subStrInput" placeholder="e.g. world" value="world">

    <button id="findBtn">Find Index</button>

    <h3>Result:</h3>
    <div id="result" class="result-box">6</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
